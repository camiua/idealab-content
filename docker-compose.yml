services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Dentro de Docker, "localhost" es el propio contenedor: Ollama está en tu ordenador
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CORS_ORIGINS: http://localhost:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend